name: CI

# Every push and pull request: run the tests.
# Every push to main and every version tag: also build EpisodeFlow.exe (portable) and
# EpisodeFlow-Setup.exe (installer), and keep them as a download on the run's page.
# A version tag (v1.2.3): attach both, with SHA256SUMS.txt, to that release
# (a draft release is made if there isn't one yet).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pyflakes src tests
      - run: python -m pytest

  build:
    if: github.event_name == 'push'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches VERSION in the code
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path src/episodeflow.py -Pattern 'VERSION = "([0-9.]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} but the code says $version" }
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
      - name: Build
        shell: cmd
        run: .\build.bat nopause
      - name: SHA256
        shell: pwsh
        run: |
          if (-not (Test-Path release/EpisodeFlow-Setup.exe)) { throw "The installer wasn't built" }
          $lines = foreach ($f in "EpisodeFlow.exe", "EpisodeFlow-Setup.exe") {
            "$((Get-FileHash "release/$f" -Algorithm SHA256).Hash.ToLower())  $f"
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt
          "SHA256" >> $env:GITHUB_STEP_SUMMARY
          $lines | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: EpisodeFlow-${{ github.sha }}
          path: |
            release/EpisodeFlow.exe
            release/EpisodeFlow-Setup.exe
            release/SHA256SUMS.txt
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = "release/EpisodeFlow.exe", "release/EpisodeFlow-Setup.exe", "release/SHA256SUMS.txt"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --draft `
              --title "EpisodeFlow $($tag.TrimStart('v'))" --notes "See CHANGELOG.md for what changed."
          }
